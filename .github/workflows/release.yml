# Builds cross-platform binaries with GoReleaser and attaches them to the
# GitHub Release for the pushed tag, making the extension installable via
# `gh extension install github/gh-elm`.
#
# Flow: release-drafter maintains a draft release on main. When a maintainer
# publishes that draft, GitHub creates the "v*" tag, which triggers this
# workflow. GoReleaser (release.mode: append) uploads the binaries onto that
# existing release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # GoReleaser needs full history/tags for versioning
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No build cache in the release job: it publishes artifacts, so a
          # shared cache would be a cache-poisoning vector.
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
