name: gh-elm E2E

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or commit SHA to test
        required: true
        type: string

permissions:
  contents: read

# Only one gh-elm E2E workflow may use the shared migration environment at a
# time. A new run waits instead of cancelling a migration already in progress.
concurrency:
  group: migration-e2e
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve candidate revision
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      harness_present: ${{ steps.candidate.outputs.harness_present }}

    steps:
      - name: Validate candidate input
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CANDIDATE_REF" ]]; then
            echo "::error::candidate_ref cannot be empty."
            exit 1
          fi

          if [[ "$CANDIDATE_REF" == -* ]]; then
            echo "::error::candidate_ref cannot begin with '-'."
            exit 1
          fi

          if [[ "$CANDIDATE_REF" == *$'\n'* ||
            "$CANDIDATE_REF" == *$'\r'* ]]; then
            echo "::error::candidate_ref cannot contain line breaks."
            exit 1
          fi

      # This job does not use the protected E2E environment and receives no E2E
      # secrets. Checking out the candidate is safe because candidate code is
      # not executed in this job.
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false

      - name: Resolve immutable commit and inspect harness
        id: candidate
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        shell: bash
        run: |
          set -euo pipefail

          sha="$(git rev-parse --verify 'HEAD^{commit}')"

          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the candidate to a full commit SHA."
            exit 1
          fi

          required_harness_files=(
            script/e2e/test-elm-ghes.sh
            script/e2e/lib/common.sh
            script/e2e/lib/evidence.sh
            script/e2e/lib/configuration.sh
            script/e2e/lib/ownership.sh
            script/e2e/lib/migration.sh
            script/e2e/lib/cleanup.sh
            script/e2e/scenarios/control-plane.sh
          )

          missing_harness_files=()

          for file in "${required_harness_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              missing_harness_files+=("$file")
            fi
          done

          if (( ${#missing_harness_files[@]} == 0 )); then
            harness_present=true
          else
            harness_present=false
          fi

          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "harness_present=$harness_present" >>"$GITHUB_OUTPUT"

          {
            echo "## gh-elm E2E candidate"
            echo
            echo "- Requested ref: \`$CANDIDATE_REF\`"
            echo "- Resolved commit: \`$sha\`"
            echo "- Environment: \`migration-e2e\`"
            echo "- Scenario: \`control-plane\`"
            echo "- Complete control-plane harness present: \`$harness_present\`"

            if (( ${#missing_harness_files[@]} > 0 )); then
              echo
              echo "### Missing harness files"
              echo

              for file in "${missing_harness_files[@]}"; do
                echo "- \`$file\`"
              done
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  no-harness:
    name: E2E harness not present
    needs: resolve
    if: needs.resolve.outputs.harness_present != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Explain why no test ran
        shell: bash
        run: |
          {
            echo "## E2E test not run"
            echo
            echo "The selected revision does not contain the complete control-plane E2E harness."
            echo
            echo "The resolve job summary lists the missing files."
            echo
            echo "No E2E credentials were requested, and no migration services were contacted."
          } >>"$GITHUB_STEP_SUMMARY"

          echo "::notice::The selected revision has an incomplete control-plane E2E harness. Nothing was run."

  e2e:
    name: Control-plane scenario
    needs: resolve
    if: needs.resolve.outputs.harness_present == 'true'
    runs-on: ubuntu-latest

    # This is the only job referencing the protected environment. Approval
    # therefore covers candidate setup and the complete control-plane scenario.
    environment:
      name: migration-e2e

    timeout-minutes: 30

    env:
      # Source GHES
      SOURCE_HOST: ${{ vars.GHES_URL }}
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      SOURCE_ORG: ${{ vars.SOURCE_ORG }}
      SOURCE_REPO: ${{ vars.SOURCE_REPO }}

      # Migration target
      TARGET_HOST: ${{ vars.TARGET_URL }}
      TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
      TARGET_ORG: ${{ vars.TARGET_ORG }}
      TARGET_VISIBILITY: ${{ vars.TARGET_VISIBILITY }}

      # GitHub CLI requires GH_TOKEN for extension installation and invocation.
      GH_TOKEN: ${{ github.token }}

    steps:
      # Check out the immutable SHA resolved before E2E credentials were
      # requested. If the branch moves while this job waits for approval, the
      # originally resolved commit is still tested.
      - name: Check out approved candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse --verify 'HEAD^{commit}')"

          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $actual_sha; expected $EXPECTED_SHA."
            exit 1
          fi

          echo "Testing immutable commit: $actual_sha"

      - name: Validate required environment configuration
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            SOURCE_HOST
            SOURCE_TOKEN
            SOURCE_ORG
            SOURCE_REPO
            TARGET_HOST
            TARGET_TOKEN
            TARGET_ORG
            TARGET_VISIBILITY
            GH_TOKEN
          )

          missing_variables=()

          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              missing_variables+=("$variable")
            fi
          done

          if (( ${#missing_variables[@]} > 0 )); then
            echo "::error::The migration-e2e environment is missing required configuration."
            printf 'Missing: %s\n' "${missing_variables[@]}"
            exit 1
          fi

          case "$TARGET_VISIBILITY" in
            private | internal)
              ;;
            *)
              echo "::error::TARGET_VISIBILITY must be private or internal."
              exit 1
              ;;
          esac

          echo "Required migration environment configuration is present."

      - name: Validate harness syntax
        shell: bash
        run: |
          set -euo pipefail

          harness_files=(
            script/e2e/test-elm-ghes.sh
            script/e2e/lib/common.sh
            script/e2e/lib/evidence.sh
            script/e2e/lib/configuration.sh
            script/e2e/lib/ownership.sh
            script/e2e/lib/migration.sh
            script/e2e/lib/cleanup.sh
            script/e2e/scenarios/control-plane.sh
          )

          for file in "${harness_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required E2E harness file is missing."
              exit 1
            fi

            echo "Checking Bash syntax: $file"

            if ! bash -n "$file"; then
              echo "::error file=$file::Bash syntax validation failed."
              exit 1
            fi
          done

          echo "All control-plane harness files passed Bash syntax validation."

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and install candidate
        shell: bash
        run: |
          set -euo pipefail

          candidate_version="e2e-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Building candidate version: $candidate_version"

          rm -f ./gh-elm

          go build \
            -trimpath \
            -ldflags "-X main.version=${candidate_version}" \
            -o ./gh-elm \
            .

          if [[ ! -x ./gh-elm ]]; then
            echo "::error::The build did not produce an executable gh-elm binary."
            exit 1
          fi

          gh extension install .

          installed_version="$(gh elm --version)"
          echo "Installed candidate: $installed_version"

          if [[ "$installed_version" != *"$candidate_version"* ]]; then
            echo "::error::gh elm did not report the expected candidate version $candidate_version."
            exit 1
          fi

      - name: Run control-plane scenario
        id: control_plane
        env:
          E2E_MODE: control-plane
          E2E_RUN_ID: actions-${{ github.run_id }}-${{ github.run_attempt }}-control-plane
          OUTDIR: ${{ github.workspace }}/elm-results/control-plane
        shell: bash
        run: bash script/e2e/test-elm-ghes.sh

      - name: Add E2E summary
        if: always()
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          SCENARIO_OUTDIR: ${{ github.workspace }}/elm-results/control-plane
        shell: bash
        run: |
          {
            echo "## gh-elm E2E execution"
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Environment: \`migration-e2e\`"
            echo "- Scenario: \`control-plane\`"
            echo "- Job result: \`$JOB_STATUS\`"
          } >>"$GITHUB_STEP_SUMMARY"

          if [[ -f "$SCENARIO_OUTDIR/evidence.md" ]]; then
            {
              echo
              echo "### Control-plane scenario"
              echo
            } >>"$GITHUB_STEP_SUMMARY"

            cat "$SCENARIO_OUTDIR/evidence.md" \
              >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo "### Control-plane scenario"
              echo
              echo "No evidence file was produced. The scenario may not have started."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gh-elm-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: elm-results/
          if-no-files-found: warn
          retention-days: 14
