name: ci

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  integration:
    name: Integration (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # Keep local extension registration and any gh configuration isolated
      # from the runner's normal user state.
      GH_CONFIG_DIR: ${{ github.workspace }}/.gh-elm-gh-config
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Show GitHub CLI version
        run: gh --version

      # Builds a temporary native executable and exercises it as a subprocess
      # against local httptest servers. This requires no external credentials.
      - name: Run CLI integration tests
        run: go test -count=1 -tags=integration ./integration/...

      # gh extension install . expects the repository-root binary name. Build
      # the Windows artifact explicitly with its .exe suffix.
      - name: Build local extension
        if: runner.os != 'Windows'
        run: go build -trimpath -ldflags "-X main.version=integration-install-test" -o gh-elm .

      - name: Build local extension
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags "-X main.version=integration-install-test" -o gh-elm.exe .

      - name: Install local extension
        run: gh extension install .

      # Confirm gh resolves the extension installed from this checkout rather
      # than any pre-existing extension, then exercise root help through gh.
      - name: Verify local extension
        shell: pwsh
        run: |
          $version = gh elm --version
          $version

          if ($version -notmatch "integration-install-test") {
            Write-Error "Expected gh elm to run the locally built extension."
            exit 1
          }

          gh elm --help

      # Each hosted runner is disposable, but remove explicitly to validate the
      # extension removal path. Do not mask an earlier failure if install failed.
      - name: Remove local extension
        if: always()
        shell: pwsh
        run: |
          gh extension remove elm
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Extension was not installed or could not be removed."
            exit 0
          }

  # Build unreleased ("snapshot") cross-platform binaries so they can be
  # downloaded and smoke-tested before a release is published. These are
  # workflow artifacts only — they are never attached to a GitHub Release and
  # are versioned as 0.0.0-SNAPSHOT-<sha>.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # GoReleaser needs full history/tags for versioning
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No build cache: this job uploads artifacts, so a shared cache is a
          # cache-poisoning vector.
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Stage platform-named binaries
        run: |
          # GoReleaser leaves the raw binaries under dist/<target>/gh-elm; the
          # release asset names (gh-elm_<ver>_<os>-<arch>) only exist as upload
          # metadata in artifacts.json. Copy them into flat, named files, then
          # tar them up so the executable bit survives the artifact round-trip
          # (actions/upload-artifact does not preserve file permissions).
          mkdir -p snapshot
          jq -r '.[]
            | select(.type == "Binary" and (.name | test("_(linux|darwin|windows)-")))
            | "\(.path)\t\(.name)"' dist/artifacts.json \
            | while IFS=$'\t' read -r path name; do cp "$path" "snapshot/$name"; done
          cp dist/checksums.txt snapshot/
          tar -czf gh-elm-snapshot-binaries.tar.gz -C snapshot .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gh-elm-snapshot-binaries
          path: gh-elm-snapshot-binaries.tar.gz
          if-no-files-found: error
